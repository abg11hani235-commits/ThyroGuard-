models:
  embeddings:
    active_model: "BAAI/bge-m3"
    active_dimension: 1024
    chroma_dir: "data/processed/chroma_bge_m3"
    collection_name: "thyroguard_bge_m3_corpus"
    normalize: true

  reranker:
    primary: "BAAI/bge-reranker-v2-m3"
    fallback: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    model_name: "BAAI/bge-reranker-v2-m3"
    batch_size: 16
    max_length: 512

  verifier:
    nli_model: "MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli"
    threshold: 0.60
    enable_nli: false
    max_tokens: 512
    dosage_strict_check: true

  generation:
    model_name: "qwen/qwen3.8-27b"
    primary_backend: "groq"
    api_endpoint: "https://api.groq.com/openai/v1/chat/completions"
    temperature: 0.1
    max_tokens: 1200
    top_p: 0.95
    enforce_arabic: true

retrieval:
  dense_model: "BAAI/bge-m3"
  reranker_model: "BAAI/bge-reranker-v2-m3"
  top_pool_k: 40
  top_k: 5
  dense_weight: 0.60
  bm25_weight: 0.40
  rrf_k: 40

cache:
  similarity_threshold: 0.92
  ttl_seconds: 86400

safety:
  enforce_emergency_0ms: true
  block_general_symptoms: true
