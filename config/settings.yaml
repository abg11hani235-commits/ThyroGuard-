app:
  name: "ThyroGuard"
  version: "1.0.0"
  description: "Evidence-Grounded Clinical RAG for Thyroid Endocrinology"
  environment: "production"
  log_level: "INFO"

paths:
  corpus: "data/processed/FROZEN_CORPUS.json"
  inventory: "data/processed/document_inventory.json"
  evaluation_dataset: "data/evaluation/gold_evaluation_dataset.json"
  chroma_index_dir: "data/processed/chroma_bge"
  reports_dir: "reports"

retrieval:
  top_pool_k: 40
  top_k: 5
  dense_weight: 0.60
  bm25_weight: 0.40
  rrf_k: 40

safety:
  enable_guardrails: true
  strict_citation_enforcement: true
  min_relevance_threshold: 0.30
  disclaimer: "DISCLAIMER: ThyroGuard provides informational clinical guideline references only and does not replace licensed medical judgment, clinical diagnosis, or individualized patient care."
